name: Testar automacao Instagram (sem publicar)

on:
  push:
    paths:
      - 'scripts/import_launch_assets.py'
      - 'scripts/publish_launch.py'
      - 'tests/test_launch_automation.py'
      - 'content/launch_queue.json'
      - 'state/launch_publications.json'
      - '.github/workflows/*launch*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir configuracao do agendamento (sem publicar)
        env:
          LAUNCH_ENABLED: ${{ vars.INSTAGRAM_LAUNCH_AUTO_PUBLISH_ENABLED }}
          LEGACY_ENABLED: ${{ vars.INSTAGRAM_AUTO_PUBLISH_ENABLED }}
        run: |
          if [ "$LAUNCH_ENABLED" = "true" ]; then
            echo "LANCAMENTO AUTOMATICO: ATIVADO (INSTAGRAM_LAUNCH_AUTO_PUBLISH_ENABLED=true)"
          else
            echo "LANCAMENTO AUTOMATICO: DESATIVADO (variavel ausente ou valor diferente de true)"
          fi
          if [ "$LEGACY_ENABLED" = "true" ]; then
            echo "::warning::Publicador antigo tambem esta ativado; considere desligar INSTAGRAM_AUTO_PUBLISH_ENABLED."
          else
            echo "PUBLICADOR ANTIGO: desativado"
          fi
      - name: Instalar dependencia de validacao
        run: python -m pip install "Pillow>=11,<13"
      - name: Executar testes offline (nao le credenciais)
        run: python -m unittest discover -s tests -p 'test_launch_automation.py' -v
      - name: Verificar sintaxe
        run: python -m py_compile scripts/import_launch_assets.py scripts/publish_launch.py
      - name: Simular lancamento importado (sem Meta e sem publicar)
        run: |
          if [ -f content/launch_queue.json ]; then
            python scripts/publish_launch.py --mode dry-run
          else
            echo "Pacote ainda nao importado: simulacao real ignorada"
          fi
