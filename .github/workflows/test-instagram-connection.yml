name: Verificar conexao Instagram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Teste somente leitura - Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar perfil sem publicar
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/test_instagram_connection.py
