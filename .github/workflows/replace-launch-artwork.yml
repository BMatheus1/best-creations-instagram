name: Substituir artes pendentes do feed (sem publicar)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da Release com o ZIP Best_Creations_Feed_07_Artes_Neutras.zip'
        type: string
        required: true
        default: 'bc-feed-neutro-2026-11'
      confirm:
        description: 'Digite SUBSTITUIR_APENAS_PENDENTES. Nenhuma postagem é enviada.'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: instagram-publication-lock
  cancel-in-progress: false

jobs:
  substituir:
    if: ${{ inputs.confirm == 'SUBSTITUIR_APENAS_PENDENTES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verificar automação pausada
        env:
          AUTO_ENABLED: ${{ vars.INSTAGRAM_LAUNCH_AUTO_PUBLISH_ENABLED }}
        run: |
          if [ "$AUTO_ENABLED" = "true" ]; then
            echo "::error::Pause a automação: mude INSTAGRAM_LAUNCH_AUTO_PUBLISH_ENABLED para false antes de substituir imagens."
            exit 1
          fi
      - name: Baixar repositório e histórico atual
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência para verificar imagens
        run: python -m pip install "Pillow>=11,<13"
      - name: Baixar ZIP de substituição da Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feed-artwork-replacement"
          gh release download "$RELEASE_TAG" --pattern "Best_Creations_Feed_07_Artes_Neutras.zip" --dir "$RUNNER_TEMP/feed-artwork-replacement"
          zip_path="$RUNNER_TEMP/feed-artwork-replacement/Best_Creations_Feed_07_Artes_Neutras.zip"
          test -f "$zip_path" || { echo "::error::ZIP não encontrado na Release"; exit 1; }
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
      - name: Validar conteúdo e ver quais já foram publicados (sem alterar)
        run: python scripts/replace_launch_artwork.py "$ZIP_PATH"
      - name: Atualizar apenas arquivos ainda não publicados (sem Meta)
        run: python scripts/replace_launch_artwork.py "$ZIP_PATH" --apply
      - name: Validar fila, hashes e testes offline
        run: |
          python -m unittest discover -s tests -p 'test_launch_automation.py' -v
          python scripts/publish_launch.py --mode dry-run
      - name: Commitar apenas as três imagens pendentes e os checksums
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/launch_queue.json media/launch/25_feed.jpg media/launch/26_feed.jpg media/launch/27_feed.jpg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração: ZIP já aplicado ou todos os itens publicados."
          else
            git commit -m "instagram-launch: substituir artes neutras pendentes [skip ci]"
            git push origin HEAD:main
          fi
          echo "Concluído. Nenhuma publicação enviada ao Instagram."
