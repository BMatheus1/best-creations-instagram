name: Importar pacote de lancamento (sem publicar)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag do GitHub Release que contem o ZIP do lancamento'
        type: string
        required: true
      confirm:
        description: 'Digite IMPORTAR_27_ARTES (esta acao nao publica posts)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: instagram-publication-lock
  cancel-in-progress: false

jobs:
  importar:
    if: ${{ inputs.confirm == 'IMPORTAR_27_ARTES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar validador de imagens
        run: python -m pip install "Pillow>=11,<13"
      - name: Bloquear sobrescrita apos tentativas de publicacao
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("state/launch_publications.json")
          if not path.is_file() or json.loads(path.read_text(encoding="utf-8")):
              raise SystemExit("Importacao bloqueada: ledger ausente ou com tentativas de publicacao")
          PY
      - name: Baixar pacote ZIP da Release (independente do nome do arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/bc-launch-release"
          mkdir -p "$download_dir"
          gh release download "$RELEASE_TAG" --pattern "*.zip" --dir "$download_dir"
          mapfile -d '' archives < <(find "$download_dir" -maxdepth 1 -type f -iname '*.zip' -print0)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::A Release deve conter exatamente 1 arquivo ZIP; encontrados: ${#archives[@]}"
            exit 1
          fi
          cp -- "${archives[0]}" "$RUNNER_TEMP/bc-launch-package.zip"
          echo "Pacote encontrado: $(basename -- "${archives[0]}")"
      - name: Validar e importar 7 Stories e 20 posts
        run: python scripts/import_launch_assets.py "$RUNNER_TEMP/bc-launch-package.zip"
      - name: Rodar testes de seguranca
        run: python -m unittest discover -s tests -p 'test_launch_automation.py' -v
      - name: Registrar imagens e fila no GitHub sem publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/launch content/launch_queue.json
          if git diff --cached --quiet; then
            echo "As 27 imagens e a fila ja estao importadas."
          else
            git commit -m "instagram-launch: importar pacote de 27 artes [skip ci]"
            git push origin HEAD:main
          fi
