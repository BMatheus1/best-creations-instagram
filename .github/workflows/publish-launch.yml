name: Lancamento Instagram - Stories e Feed

on:
  push:
    paths:
      - '.github/workflows/publish-launch.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Simular ou publicar a proxima midia da fila'
        type: choice
        options:
          - dry-run
          - publish-next
          - publish-batch
        required: true
        default: dry-run
      confirm:
        description: 'Proximo: PUBLICAR_PROXIMO; lote: PUBLICAR_LOTE; dry-run: em branco'
        type: string
        required: false
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: instagram-publication-lock
  cancel-in-progress: false

jobs:
  lancamento:
    if: ${{ (github.event_name == 'schedule' && vars.INSTAGRAM_LAUNCH_AUTO_PUBLISH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.action != 'publish-batch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias para validacao de imagens
        run: python -m pip install "Pillow>=11,<13"
      - name: Executar testes offline
        run: python -m unittest discover -s tests -p 'test_launch_automation.py' -v
      - name: Simular proxima publicacao (nenhum envio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run' }}
        run: python scripts/publish_launch.py --mode dry-run
      - name: Conferir autenticacao Instagram antes de publicar (somente leitura)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish-next') }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/test_instagram_connection.py
      - name: Publicar um item explicitamente autorizado
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'publish-next' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_LAUNCH_ENABLE_MANUAL: 'true'
          CONFIRM: ${{ inputs.confirm }}
        run: python scripts/publish_launch.py --mode manual --confirm "$CONFIRM"
      - name: Publicacao automatica opcional (desativada ate voce habilitar)
        if: ${{ github.event_name == 'schedule' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_LAUNCH_ENABLE_AUTO: 'true'
        run: python scripts/publish_launch.py --mode auto

  lote_continuo:
    name: Publicar fila com 5 minutos entre conteúdos (sem depender do cron)
    if: ${{ vars.INSTAGRAM_LAUNCH_AUTO_PUBLISH_ENABLED == 'true' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[start-launch-batch]')) || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish-batch' && inputs.confirm == 'PUBLICAR_LOTE')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Baixar repositório e histórico já publicado
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de testes
        run: python -m pip install "Pillow>=11,<13"
      - name: Validar ordem, arquivos e salvaguardas sem publicar
        run: |
          python -m py_compile scripts/publish_launch.py scripts/run_launch_batch.py
          python -m unittest discover -s tests -p 'test_launch_automation.py' -v
          python scripts/publish_launch.py --mode dry-run
      - name: Validar conta Business e token Meta (somente leitura)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/test_instagram_connection.py
      - name: Continuar as publicações em ordem a cada 5 minutos
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_LAUNCH_ENABLE_AUTO: 'true'
          INSTAGRAM_LAUNCH_VARIABLE_ENABLED: ${{ vars.INSTAGRAM_LAUNCH_AUTO_PUBLISH_ENABLED }}
        run: python -u scripts/run_launch_batch.py
